services:
    postgres:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: peppol
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d peppol']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        command:
            [
                'redis-server',
                '--appendonly',
                'yes',
                '--requirepass',
                '${REDIS_PASSWORD:-devpassword}',
            ]
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD:-devpassword}
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        image: peppol-hono-api:local
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/peppol
            REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
            PORT: 3001
            RUN_MIGRATIONS: 'true'
        restart: unless-stopped
        ports:
            - '3001:3001'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O - http://localhost:3001/api/health > /dev/null',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    webhook-worker:
        image: peppol-hono-api:local
        command: ['node', 'dist/worker.mjs']
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/peppol
            REDIS_URL: redis://:${REDIS_PASSWORD:-devpassword}@redis:6379
            RUN_MIGRATIONS: 'false'
        restart: unless-stopped
        depends_on:
            api:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data:
