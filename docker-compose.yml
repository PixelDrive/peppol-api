services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: peppol
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: password
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres -d peppol']
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: Dockerfile
        env_file:
            - .env
        environment:
            DATABASE_URL: postgresql://postgres:password@postgres:5432/peppol
            PORT: 3001
            RUN_MIGRATIONS: 'true'
        ports:
            - '3001:3001'
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    postgres_data:
